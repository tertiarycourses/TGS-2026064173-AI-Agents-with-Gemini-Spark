name: Publish learner lab steps
on:
  push:
    branches: [main]
    paths: ['labs/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare learner-only site
        run: |
          mkdir -p site-release
          cp -R labs site-release/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=labs/prompts.html"><title>Lab Prompts</title><a href="labs/prompts.html">Open lab prompts</a>' > site-release/index.html
          touch site-release/.nojekyll
          if find site-release -type f | grep -Ei '(^|/)(\.env|assessment|reference)(/|$)|/(FG_|Assessment_Plan_|Answer to )'; then
            echo 'Private material in publication tree'; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-release
      - id: deployment
        uses: actions/deploy-pages@v4
